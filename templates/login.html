{% extends 'base.html' %} {% block title %}Login - Jagamata{% endblock %} {%
block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-200px)]">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl p-8 border border-gray-100 shadow-sm">
      <!-- Header -->
      <div class="text-center mb-8">
        <div
          class="w-12 h-12 bg-primary-600 rounded-xl flex items-center justify-center text-white mx-auto mb-4"
        >
          <i class="fas fa-sign-in-alt text-lg"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Selamat Datang</h1>
        <p class="text-gray-500 text-sm">Masuk ke akun Jagamata Anda</p>
      </div>

      <!-- Form -->
      <form method="POST" class="space-y-5" id="loginForm">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-1.5"
          >
            Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="nama@email.com"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-200 transition text-sm"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1.5"
          >
            Password
          </label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Masukkan password"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-200 transition text-sm"
          />
        </div>

        <div class="flex items-center justify-end">
          <a
            href="{{ url_for('web.forgot_password') }}"
            class="text-sm text-primary-600 hover:text-primary-700 font-medium"
          >
            Lupa Password?
          </a>
        </div>

        <button
          type="submit"
          class="w-full btn-primary text-white font-medium py-2.5 rounded-lg transition"
        >
          Masuk
        </button>
      </form>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-3 bg-white text-gray-400">atau</span>
        </div>
      </div>

      <!-- OAuth Buttons -->
      <div class="mb-6">
        <a
          href="{{ url_for('web.oauth_google') }}"
          class="flex items-center justify-center w-full px-4 py-2.5 border border-gray-200 text-gray-700 hover:bg-gray-50 rounded-lg font-medium transition text-sm"
        >
          <svg class="w-4 h-4 mr-2" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Masuk dengan Google
        </a>
      </div>

      <!-- Register Link -->
      <p class="text-center text-sm text-gray-500">
        Belum punya akun?
        <a
          href="{{ url_for('web.register') }}"
          class="text-primary-600 hover:text-primary-700 font-medium"
        >
          Daftar
        </a>
      </p>
    </div>

    <!-- Additional Info -->
    <div class="mt-4 text-center">
      <p class="text-xs text-gray-400 flex items-center justify-center gap-1">
        <i class="fas fa-lock"></i>
        Dilindungi dengan enkripsi tingkat tinggi
      </p>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const loginForm = document.getElementById("loginForm");

    if (loginForm) {
      loginForm.addEventListener("submit", async function (e) {
        // Biarkan form submit normal via Flask
      });
    }

    const token = localStorage.getItem("token");
    if (!token && document.querySelector('a[href*="logout"]')) {
      fetch("/api/auth/me", {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token || ""}`,
        },
      }).catch(() => {});
    }
  });
</script>
{% endblock %}
