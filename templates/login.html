{% extends 'base.html' %} {% block title %}Login - Jagamata{% endblock %} {%
  block content %}
  <div class="flex items-center justify-center min-h-[calc(100vh-200px)]">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">
        <!-- Header -->
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 btn-gradient rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-lg"
          >
            <i class="fas fa-sign-in-alt"></i>
          </div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Selamat Datang</h1>
          <p class="text-gray-600">Masuk ke akun Jagamata Anda</p>
        </div>
  
        <!-- Form -->
        <form method="POST" class="space-y-6">
          <div>
            <label
              for="username"
              class="block text-sm font-semibold text-gray-700 mb-2"
            >
              <i class="fas fa-user mr-2 text-sky-500"></i>Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              required
              placeholder="Masukkan username Anda"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
            />
          </div>
  
          <div>
            <label
              for="password"
              class="block text-sm font-semibold text-gray-700 mb-2"
            >
              <i class="fas fa-lock mr-2 text-sky-500"></i>Password
            </label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Masukkan password Anda"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
            />
          </div>
  
          <div class="flex items-center justify-end">
            <a
              href="{{ url_for('web.forgot_password') }}"
              class="text-sm text-sky-600 hover:text-sky-700 font-medium"
            >
              Lupa Password?
            </a>
          </div>
  
          <button
            type="submit"
            class="w-full btn-gradient text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition"
          >
            <i class="fas fa-sign-in-alt mr-2"></i>
            Masuk Sekarang
          </button>
        </form>
  
        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500 font-medium"
              >Atau masuk dengan</span
            >
          </div>
        </div>
  
        <!-- OAuth Buttons -->
        <div class="space-y-3 mb-8">
          <!-- Updated OAuth link to use web OAuth route -->
          <a
            href="{{ url_for('web.oauth_google') }}"
            class="flex items-center justify-center w-full px-6 py-3 border-2 border-gray-300 text-gray-700 hover:bg-gray-50 rounded-xl font-semibold transition"
          >
            <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
            Masuk dengan Google
          </a>
        </div>
  
        <!-- Divider -->
        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500 font-medium"
              >Belum punya akun?</span
            >
          </div>
        </div>
  
        <!-- Register Link -->
        <div class="text-center">
          <a
            href="{{ url_for('web.register') }}"
            class="inline-block w-full px-6 py-3 border-2 border-sky-500 text-sky-600 hover:bg-sky-50 rounded-xl font-semibold transition"
          >
            <i class="fas fa-user-plus mr-2"></i>
            Daftar Sekarang
          </a>
        </div>
      </div>
  
      <!-- Additional Info -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          <i class="fas fa-shield-alt text-green-500 mr-2"></i>
          Dilindungi dengan enkripsi tingkat tinggi
        </p>
      </div>
    </div>
  </div>
  {% endblock %}
