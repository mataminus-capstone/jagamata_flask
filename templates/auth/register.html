{% extends 'base.html' %} {% block title %}Register - Jagamata{% endblock %} {%
block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-200px)] py-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">
      <!-- Header -->
      <div class="text-center mb-8">
        <div
          class="w-16 h-16 btn-gradient rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-lg"
        >
          <i class="fas fa-user-plus"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Daftar Sekarang</h1>
        <p class="text-gray-600">
          Buat akun Jagamata Anda dan mulai perjalanan kesehatan mata
        </p>
      </div>

      <!-- Form -->
      <form method="POST" class="space-y-5">
        <div>
          <label
            for="username"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            <i class="fas fa-user mr-2 text-sky-500"></i>Username
          </label>
          <input
            type="text"
            id="username"
            name="username"
            required
            placeholder="Pilih username unik"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
          />
        </div>

        <div>
          <label
            for="email"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            <i class="fas fa-envelope mr-2 text-sky-500"></i>Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Masukkan email Anda"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            <i class="fas fa-lock mr-2 text-sky-500"></i>Password
          </label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Minimal 6 karakter"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
          />
        </div>

        <div>
          <label
            for="confirm_password"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            <i class="fas fa-lock mr-2 text-sky-500"></i>Konfirmasi Password
          </label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
            placeholder="Ulangi password"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full btn-gradient text-white font-bold py-4 rounded-xl shadow-lg"
        >
          <i class="fas fa-rocket mr-2"></i>
          Daftar Sekarang
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-4 bg-white text-gray-500 font-medium"
            >Sudah punya akun?</span
          >
        </div>
      </div>

      <!-- Login Link -->
      <div class="text-center">
        <a
          href="{{ url_for('auth.login') }}"
          class="inline-block w-full px-6 py-3 border-2 border-sky-500 text-sky-600 hover:bg-sky-50 rounded-xl font-semibold transition"
        >
          <i class="fas fa-sign-in-alt mr-2"></i>
          Masuk Sekarang
        </a>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="mt-6 text-center space-y-2">
      <p class="text-sm text-gray-600">
        <i class="fas fa-shield-alt text-green-500 mr-2"></i>
        Data Anda aman dan terenkripsi
      </p>
      <p class="text-sm text-gray-600">
        <i class="fas fa-check-circle text-green-500 mr-2"></i>
        Gratis selamanya, tanpa biaya tersembunyi
      </p>
    </div>
  </div>
</div>
{% endblock %}
