{% extends 'base.html' %} {% block title %}Reset Password - Jagamata{% endblock
%} {%block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-200px)]">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">
      <!-- Header -->
      <div class="text-center mb-8">
        <div
          class="w-16 h-16 bg-gradient-to-br from-green-500 to-teal-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-lg"
        >
          <i class="fas fa-lock-open"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Reset Password</h1>
        <p class="text-gray-600">Masukkan password baru Anda</p>
      </div>

      <form method="POST" class="space-y-6">
        <div>
          <label
            for="password"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            <i class="fas fa-lock mr-2 text-sky-500"></i>Password Baru
          </label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Minimal 6 karakter"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
          />
        </div>

        <div>
          <label
            for="confirm_password"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            <i class="fas fa-lock mr-2 text-sky-500"></i>Konfirmasi Password
            Baru
          </label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
            placeholder="Ulangi password baru"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-green-500 to-teal-600 text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition"
        >
          <i class="fas fa-check mr-2"></i>
          Reset Password
        </button>
      </form>

      <div class="mt-8 text-center">
        <a
          href="{{ url_for('auth.login') }}"
          class="text-sky-600 hover:text-sky-700 font-medium text-sm"
        >
          <i class="fas fa-arrow-left mr-2"></i>
          Kembali ke Login
        </a>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="mt-6 text-center">
      <p class="text-sm text-gray-600">
        <i class="fas fa-shield-alt text-green-500 mr-2"></i>
        Password Anda akan diamankan dengan enkripsi
      </p>
    </div>
  </div>
</div>
{% endblock %}
