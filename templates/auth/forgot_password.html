{% extends 'base.html' %} {% block title %}Lupa Password - Jagamata{% endblock
%} {% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-200px)]">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">
      <!-- Header -->
      <div class="text-center mb-8">
        <div
          class="w-16 h-16 bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-lg"
        >
          <i class="fas fa-key"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Lupa Password?</h1>
        <p class="text-gray-600">
          Masukkan email Anda dan kami akan mengirimkan link untuk reset
          password
        </p>
      </div>

      <!-- Form -->
      <form method="POST" class="space-y-6">
        <div>
          <label
            for="email"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            <i class="fas fa-envelope mr-2 text-sky-500"></i>Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Masukkan email Anda"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition"
        >
          <i class="fas fa-paper-plane mr-2"></i>
          Kirim Link Reset
        </button>
      </form>

      <!-- Back to Login -->
      <div class="mt-8 text-center">
        <a
          href="{{ url_for('auth.login') }}"
          class="text-sky-600 hover:text-sky-700 font-medium text-sm"
        >
          <i class="fas fa-arrow-left mr-2"></i>
          Kembali ke Login
        </a>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="mt-6 text-center">
      <p class="text-sm text-gray-600">
        <i class="fas fa-info-circle text-blue-500 mr-2"></i>
        Link reset akan dikirim ke email Anda
      </p>
    </div>
  </div>
</div>
{% endblock %}
