{% extends "dashboard.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Edit Obat</h2>
            <p class="text-gray-500 mt-1">Perbarui informasi obat.</p>
        </div>

        <form method="POST" action="{{ url_for('web.edit_medicine', medicine_id=medicine.id) }}" enctype="multipart/form-data" class="space-y-6">
            <!-- Nama Obat -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nama Obat</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-pills text-gray-400"></i>
                    </div>
                    <input type="text" name="name" id="name" required value="{{ medicine.name }}"
                        class="pl-10 block w-full rounded-lg border-gray-300 border focus:ring-teal-500 focus:border-teal-500 py-2.5 text-sm shadow-sm transition">
                </div>
            </div>

            <!-- Kategori -->
            <div>
                <label for="category_id" class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-tag text-gray-400"></i>
                    </div>
                    <select name="category_id" id="category_id" required
                        class="pl-10 block w-full rounded-lg border-gray-300 border focus:ring-teal-500 focus:border-teal-500 py-2.5 text-sm shadow-sm transition bg-white">
                        <option value="" disabled>-- Pilih Kategori --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if medicine.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Harga -->
            <div>
                <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Harga (Rp)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                         <span class="text-gray-400 font-bold">Rp</span>
                    </div>
                    <input type="number" name="price" id="price" required min="0" step="500" value="{{ medicine.price }}"
                        class="pl-10 block w-full rounded-lg border-gray-300 border focus:ring-teal-500 focus:border-teal-500 py-2.5 text-sm shadow-sm transition">
                </div>
            </div>
            
             <!-- Gambar -->
             <div>
                <label for="image" class="block text-sm font-medium text-gray-700 mb-1">Gambar Obat (Biarkan kosong jika tidak diubah)</label>
                {% if medicine.image_url %}
                <div class="mb-2">
                    <img src="{{ medicine.image_url }}" alt="Current Image" class="h-20 w-20 object-cover rounded-lg border border-gray-200">
                </div>
                {% endif %}
                <input type="file" name="image" id="image" accept="image/*"
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 transition">
            </div>

            <!-- Deskripsi -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Deskripsi & Indikasi</label>
                <textarea name="description" id="description" rows="4" 
                    class="block w-full rounded-lg border-gray-300 border focus:ring-teal-500 focus:border-teal-500 p-3 text-sm shadow-sm transition">{{ medicine.description }}</textarea>
            </div>

            <div class="flex items-center gap-4 pt-4 border-t border-gray-100 mt-6">
                <a href="{{ url_for('web.dashboard_medicines') }}" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition">
                    Batal
                </a>
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-medium shadow-md hover:shadow-lg transition flex items-center gap-2">
                    <i class="fas fa-save"></i> Perbarui Obat
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
