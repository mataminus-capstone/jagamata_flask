{% extends "dashboard.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    
    <!-- Header -->
    <div class="flex items-center gap-4 mb-8 pb-6 border-b border-gray-100">
      <div class="w-12 h-12 bg-sky-100 rounded-xl flex items-center justify-center text-sky-600 text-xl">
        <i class="fas fa-pen-fancy"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Buat Artikel Baru</h1>
        <p class="text-gray-500 text-sm">Bagikan informasi kesehatan mata terbaru</p>
      </div>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-6">
      <!-- Title -->
      <div>
        <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">Judul Artikel</label>
        <input
          type="text"
          id="title"
          name="title"
          required
          placeholder="Contoh: 5 Tips Menjaga Kesehatan Mata"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition text-gray-900 placeholder-gray-400"
        />
      </div>
      
      <!-- Image Upload -->
      <div>
        <label for="image" class="block text-sm font-semibold text-gray-700 mb-2">Gambar Sampul</label>
        <div class="border-2 border-dashed border-gray-200 rounded-xl p-8 text-center hover:bg-gray-50 transition cursor-pointer relative group">
            <input
              type="file"
              id="image"
              name="image"
              accept="image/*"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
            />
            <div class="flex flex-col items-center gap-2 text-gray-500">
                <i class="fas fa-cloud-upload-alt text-3xl group-hover:text-sky-500 transition"></i>
                <span class="text-sm font-medium">Klik untuk upload gambar</span>
            </div>
        </div>
      </div>
      
      <!-- Content -->
      <div>
        <label for="content" class="block text-sm font-semibold text-gray-700 mb-2">Konten Artikel</label>
        <textarea
          id="content"
          name="content"
          required
          rows="12"
          placeholder="Tulis isi artikel Anda..."
          class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition font-sans text-gray-900 placeholder-gray-400 leading-relaxed resize-y"
        ></textarea>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-4 pt-4 border-t border-gray-100">
        <a
          href="{{ url_for('web.dashboard_articles') }}"
          class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl transition"
        >
          Batal
        </a>
        <button
          type="submit"
          class="flex-1 px-6 py-3 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl transition shadow-lg shadow-sky-200"
        >
          <i class="fas fa-paper-plane mr-2"></i> Publikasikan
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
