{% extends 'base.html' %} {% block title %}Lupa Password - Jagamata{% endblock
%} {% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-200px)]">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl p-8 border border-gray-100 shadow-sm">
      <div class="text-center mb-8">
        <div
          class="w-12 h-12 bg-primary-600 rounded-xl flex items-center justify-center text-white mx-auto mb-4"
        >
          <i class="fas fa-key text-lg"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Lupa Password</h1>
        <p class="text-gray-500 text-sm">
          Masukkan email Anda untuk reset password
        </p>
      </div>

      <form class="space-y-5">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-1.5"
          >
            Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="nama@email.com"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-200 transition text-sm"
          />
        </div>

        <button
          type="submit"
          class="w-full btn-primary text-white font-medium py-2.5 rounded-lg transition"
        >
          <i class="fas fa-paper-plane mr-2"></i>
          Kirim Link Reset
        </button>
      </form>

      <div class="mt-6 text-center">
        <a
          href="{{ url_for('web.login') }}"
          class="text-sm text-gray-500 hover:text-primary-600 transition"
        >
          <i class="fas fa-arrow-left mr-1"></i>
          Kembali ke Login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
