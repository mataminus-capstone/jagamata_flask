{% extends "dashboard.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Tambah Kategori Baru</h2>
            <p class="text-gray-500 mt-1">Tambahkan kategori untuk mengelompokkan obat-obatan.</p>
        </div>

        <form method="POST" action="{{ url_for('web.create_category') }}" class="space-y-6">
            <!-- Nama Kategori -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nama Kategori</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-tag text-gray-400"></i>
                    </div>
                    <input type="text" name="name" id="name" required placeholder="Contoh: Obat Tetes, Vitamin Mata"
                        class="pl-10 block w-full rounded-lg border-gray-300 border focus:ring-teal-500 focus:border-teal-500 py-2.5 text-sm shadow-sm transition">
                </div>
            </div>

            <div class="flex items-center gap-4 pt-4 border-t border-gray-100 mt-6">
                <a href="{{ url_for('web.dashboard_categories') }}" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition">
                    Batal
                </a>
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-medium shadow-md hover:shadow-lg transition flex items-center gap-2">
                    <i class="fas fa-save"></i> Simpan Kategori
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
