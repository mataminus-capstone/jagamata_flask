<div class="fixed bottom-6 right-6 z-50">
    <div id="chatbot-widget" class="rounded-2xl bg-white w-16 h-16 shadow-2xl transition-all">
        <button id="chatbot-toggle" class="w-full h-full flex items-center justify-center text-white font-bold text-2xl rounded-2xl bg-gradient-to-r from-sky-500 to-cyan-500 hover:scale-105 transition">
            <i class="fas fa-comments"></i>
        </button>
        <div id="chatbot-content" class="hidden fixed bottom-24 right-6 w-96 max-h-96 rounded-2xl bg-white shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-gradient-to-r from-sky-500 to-cyan-500 text-white p-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-robot"></i>
                    <span class="font-semibold">Asisten Jagamata</span>
                </div>
                <button id="chatbot-close" class="hover:bg-white/20 p-1 rounded transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 bg-gray-50 space-y-3">
                <div class="flex gap-2">
                    <div class="w-8 h-8 bg-gradient-to-br from-sky-400 to-cyan-400 rounded-full flex-shrink-0"></div>
                    <div class="bg-white p-3 rounded-lg text-sm text-gray-700">Halo! Ada yang bisa saya bantu?</div>
                </div>
            </div>
            <form id="chat-form" class="p-4 border-t border-gray-200 flex gap-2 bg-white">
                <input type="text" id="chat-input" placeholder="Ketik pesan..." class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-sky-500" />
                <button type="submit" class="px-4 py-2 bg-gradient-to-r from-sky-500 to-cyan-500 text-white rounded-lg font-semibold">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const widget = document.getElementById('chatbot-widget');
    const toggle = document.getElementById('chatbot-toggle');
    const close = document.getElementById('chatbot-close');
    const content = document.getElementById('chatbot-content');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const messages = document.getElementById('chat-messages');

    toggle.addEventListener('click', () => {
        content.classList.toggle('hidden');
        widget.classList.toggle('w-96');
        widget.classList.toggle('h-96');
    });

    close.addEventListener('click', () => {
        content.classList.add('hidden');
        widget.classList.remove('w-96');
        widget.classList.remove('h-96');
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = input.value.trim();
        if (!msg) return;

        const userDiv = document.createElement('div');
        userDiv.className = 'flex justify-end';
        userDiv.innerHTML = `<div class="bg-sky-500 text-white p-3 rounded-lg text-sm max-w-xs">${msg}</div>`;
        messages.appendChild(userDiv);
        input.value = '';
        messages.scrollTop = messages.scrollHeight;

        try {
            const res = await fetch('/chatbot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) });
            const data = await res.json();
            const botDiv = document.createElement('div');
            botDiv.className = 'flex gap-2';
            botDiv.innerHTML = `<div class="w-8 h-8 bg-gradient-to-br from-sky-400 to-cyan-400 rounded-full flex-shrink-0"></div><div class="bg-white p-3 rounded-lg text-sm text-gray-700">${data.response}</div>`;
            messages.appendChild(botDiv);
            messages.scrollTop = messages.scrollHeight;
        } catch (e) {
            console.error(e);
        }
    });
</script>
