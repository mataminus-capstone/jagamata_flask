{% extends "dashboard.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
  
  <!-- Back Button & Actions -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
    <a href="{{ url_for('web.dashboard_articles') }}" class="text-gray-500 hover:text-gray-700 font-semibold flex items-center gap-2 transition">
        <i class="fas fa-arrow-left"></i> Kembali ke Daftar
    </a>
    
    <div class="flex gap-3">
        <a href="{{ url_for('web.edit_article', article_id=article.id) }}" class="px-4 py-2 bg-yellow-100 text-yellow-700 hover:bg-yellow-200 rounded-lg font-semibold text-sm transition flex items-center gap-2">
            <i class="fas fa-edit"></i> Edit
        </a>
        <form method="POST" action="{{ url_for('web.delete_article', article_id=article.id) }}" onsubmit="return confirm('Apakah Anda yakin ingin menghapus artikel ini?');">
            <button type="submit" class="px-4 py-2 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg font-semibold text-sm transition flex items-center gap-2">
                <i class="fas fa-trash"></i> Hapus
            </button>
        </form>
    </div>
  </div>

  <!-- Article Preview Card -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    
    {% if article.image_url %}
    <div class="w-full h-80 overflow-hidden bg-gray-100 relative">
      <img src="{{ article.image_url }}" alt="{{ article.title }}" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
      <div class="absolute bottom-6 left-6 text-white">
          <span class="bg-sky-500/90 backdrop-blur-sm px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider mb-2 inline-block shadow-sm">
            Article Preview
          </span>
      </div>
    </div>
    {% endif %}

    <div class="p-8 md:p-10">
      <h1 class="text-3xl font-bold text-gray-900 mb-6 leading-tight">{{ article.title }}</h1>
      
      <div class="flex items-center gap-4 mb-8 pb-8 border-b border-gray-100 text-sm text-gray-500">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fas fa-user text-gray-400"></i>
            </div>
            <span class="font-medium text-gray-900">{{ article.author.username }}</span>
        </div>
        <span>&bull;</span>
        <div class="flex items-center gap-2">
            <i class="far fa-calendar"></i>
            <span>{{ article.created_at.strftime('%d %B %Y') }}</span>
        </div>
      </div>

      <div class="prose prose-slate max-w-none prose-lg">
        {{ article.content | replace('\n', '<br />') | safe }}
      </div>
    </div>
  </div>
</div>
{% endblock %}
